<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecordingXRay: no recording open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0B0E16}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ib:hover{background:rgba(255,255,255,0.08)}
.rec:hover{background:rgba(255,255,255,0.05)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #0B0E16; color: #E8ECF6; font-family: 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; font-size: 13px; border: 1px solid #232A3B; border-radius: 10px">

  <div style="height: 40px; flex: 0 0 40px; display: flex; align-items: center; gap: 12px; padding-left: 14px">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="5" fill="{{accent}}"/><circle cx="9" cy="9" r="4.2" fill="none" stroke="#1A0F05" stroke-width="1.6"/><path d="M9 2.5v3M9 12.5v3M2.5 9h3M12.5 9h3" stroke="#1A0F05" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span style="font-size: 12.5px; font-weight: 600; color: #C3CBDD">RecordingXRay</span>
    <div style="flex: 1; display: flex; justify-content: center">
      <div style="width: 520px; height: 28px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #131824; border: 1px solid #232A3B; border-radius: 8px; color: #8791AD; font-size: 12px">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#8791AD" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h5l3 3v8.5a.5.5 0 0 1-.5.5h-7.5a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5zM9 2v3h3"/></svg>
        No recording open
      </div>
    </div>
    <button style="height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 8px; background: {{accent}}; color: #1A0F05; font-weight: 600; font-size: 12.5px">Open</button>
    <div style="display: flex; margin-left: 8px">
      <button class="ib" aria-label="Minimize" style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" stroke="#C3CBDD" stroke-width="1" aria-hidden="true"><path d="M0 5h10"/></svg></button>
      <button class="ib" aria-label="Maximize" style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#C3CBDD" stroke-width="1" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"/></svg></button>
      <button class="ib" aria-label="Close" style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" stroke="#C3CBDD" stroke-width="1" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </div>

  <div style="height: 44px; flex: 0 0 44px; display: flex; align-items: center; gap: 28px; padding: 0 20px; border-top: 1px solid #1B2130; border-bottom: 1px solid #1B2130; background: #0E121B">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #8791AD">{{s}}</span>
        <span style="font-family: 'Cascadia Mono',Consolas,monospace; font-size: 15px; font-weight: 600; color: #5E6985">—</span>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1; min-height: 0; padding: 12px 12px 0; display: flex">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; background: #11151F; border: 1px dashed #3A4460; border-radius: 12px">
      <div style="width: 440px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="14" width="52" height="38" rx="6"/><path d="M10 40h52M24 14v26M36 52v6M26 58h20"/><circle cx="46" cy="27" r="5"/></svg>
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">Open a joinfs recording</h1>
        <p style="margin: 0; line-height: 1.5; color: #A3ADC5">Drop a .jfs file here to see every aircraft on a map, browse its frames on a timeline and inspect each recorded value.</p>
        <button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 22px; border-radius: 10px; background: {{accent}}; color: #1A0F05; font-weight: 600; font-size: 14px">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1A0F05" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></svg>
          Choose file
        </button>
        <div style="width: 100%; margin-top: 10px; text-align: left">
          <div style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #8791AD; margin-bottom: 6px">Recent</div>
          <button class="rec" style="width: 100%; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: #161B27; border: 1px solid #232A3B; text-align: left">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#8791AD" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h5l3 3v8.5a.5.5 0 0 1-.5.5h-7.5a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5zM9 2v3h3"/></svg>
            <span style="font-weight: 600">tigers 3rd.jfs</span>
            <span style="flex: 1; font-family: 'Cascadia Mono',Consolas,monospace; font-size: 11.5px; color: #8791AD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">C:\Users\crist\Downloads</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div style="flex: 0 0 248px; margin: 12px 12px 0; display: flex; flex-direction: column; background: #0E121B; border: 1px solid #232A3B; border-radius: 10px; overflow: hidden">
    <div style="height: 44px; flex: 0 0 44px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #232A3B; background: #11151F; font-family: 'Cascadia Mono',Consolas,monospace; font-size: 20px; font-weight: 600; color: #3A4460">00:00.000</div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #8791AD">Aircraft tracks appear here once a recording is open</div>
  </div>

  <div style="height: 28px; flex: 0 0 28px; display: flex; align-items: center; padding: 0 16px; font-size: 12px; color: #8791AD">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #5E6985"></span>Ready</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#4C8DFF","#4FD1B5","#F2C14B"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF8A3D',
      stats: ['Version', 'Aircraft', 'Objects', 'Frames', 'Duration']
    };
  }
}
</script>
</body>
</html>
