name: Docker Publish

on:
  push:
    tags: ['v*']
  # Manual run from main: gh workflow run docker-publish.yml -f version=26.7
  # Needed because a release created by build-test.yml with GITHUB_TOKEN does not trigger the tag push.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (e.g. 26.7); builds the source of tag v<version>'
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/joinfs-console
          tags: |
            type=match,pattern=v(\d+(\.\d+)+.*),group=1,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
