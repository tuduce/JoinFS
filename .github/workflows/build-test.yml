name: Build JoinFS

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version number for the release'
        required: true
        type: string

jobs:

  build:

    strategy:
      matrix:
        include:
          - configuration: FS2024
            arch: x64
          - configuration: FS2020
            arch: x64
          - configuration: FSX
            arch: x86
          - configuration: P3D
            arch: x86
          - configuration: XPLANE
            arch: x64
          - configuration: CONSOLE
            arch: x64
          - configuration: CONSOLE
            arch: AMD64

    runs-on: self-hosted

    env:
      Solution_Name: JoinFS.sln
      Test_Project: JoinFS.Tests\JoinFS.Tests.csproj
      App_Project: JoinFS\JoinFS.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set VERSION variable
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.VERSION }}"
          } else {
            $ver = "${{ github.ref_name }}" -replace "^v", ""
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

#      - name: Install .NET Core
#        uses: actions/setup-dotnet@v4
#        with:
#          dotnet-version: 8.0.x
          
#      - name: Install WiX Toolset
#        run: dotnet tool install --global wix --version 6.0.2
      
#      - name: Setup MSBuild.exe
#        uses: microsoft/setup-msbuild@v2

      - name: Execute unit tests
        run: dotnet test ${env:Test_Project} -c FS2024-Debug /p:Platform=x64

      - name: Restore NuGet packages
        run: dotnet restore ${env:Solution_Name} /p:Configuration=${{ matrix.configuration }}

      - name: Build App Variants
        run: dotnet build ${env:App_Project} -c ${{ matrix.configuration }} /p:PlatformTarget=${{ matrix.arch }}

      - name: Build Installers
        run: |
          cd JoinFS\Installer\
          dotnet build JoinFS.wixproj -c ${{ matrix.configuration }} /p:Platform=${{ matrix.arch }}

      - name: Rename Output Files
        shell: pwsh
        run: |
          Get-ChildItem -Path "JoinFS\Installer\bin\" -Include *.msi, *.zip -Recurse | ForEach-Object {
            $newName = "JoinFS-${{ matrix.configuration }}-${{ matrix.arch }}-${env:VERSION}" + $_.Extension
            Rename-Item -Path $_.FullName -NewName $newName
          }
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: JoinFS-${{ matrix.configuration }}-${{ matrix.arch }}
          path: |
            JoinFS\Installer\bin\**\*.msi
            JoinFS\Installer\bin\**\*.zip
          retention-days: 2

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    
    - name: Set VERSION variable
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.VERSION }}" >> $GITHUB_ENV
        else
          # Extract version from tag (remove 'v' prefix)
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        fi
    
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    
    - name: Check for release notes
      id: check_notes
      run: |
        if [ -f "Readmes/Release-${{ env.VERSION }}.md" ]; then
          echo "notes_exist=true" >> $GITHUB_OUTPUT
        else
          echo "notes_exist=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Read release notes
      id: read_notes
      if: steps.check_notes.outputs.notes_exist == 'true'
      run: |
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
        cat Readmes/Release-${{ env.VERSION }}.md >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
    
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        name: JoinFS v${{ env.VERSION }}
        body: ${{ steps.check_notes.outputs.notes_exist == 'true' && env.RELEASE_NOTES || format('Release version {0}', env.VERSION) }}
        draft: false
        prerelease: false
        files: |
          artifacts/**/*.msi
          artifacts/**/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
